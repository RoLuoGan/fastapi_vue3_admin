# 应用服务
services:
  # 数据库服务
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "FastApi123abc"
      MYSQL_DATABASE: "fastapiadmin"
    ports:
      - "3306:3306"
    volumes:
      - ./devops/mysql/data:/var/lib/mysql
      - ./devops/mysql/conf:/etc/mysql/conf.d
      - ./devops/mysql/logs:/var/log/mysql
    networks:
      - app_network

  # redis服务
  redis:
    container_name: redis
    image: redis:6
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"
    volumes:
      - ./devops/redis/conf/redis.conf:/etc/redis/redis.conf
      - ./devops/redis/data:/data
      - ./devops/redis/logs:/var/log/redis
    command: redis-server /etc/redis/redis.conf
    networks:
      - app_network
    
  # 后端服务
  backend:
    container_name: backend
    build:
      context: ./
      dockerfile: ./devops/backend/Dockerfile
    image: backend:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/home
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  # celery-worker服务
  celery-worker:
    container_name: celery-worker
    build:
      context: ./
      dockerfile: ./devops/backend/Dockerfile
    image: backend:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./backend:/home
    depends_on:
      - mysql
      - redis
    networks:
      - app_network
    command: ["devops-admin", "celery-worker", "--env=prod", "--queue=scripts", "--concurrency=4"]
  
  # 前端nginx服务
  nginx:
    container_name: nginx
    image: nginx:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html/frontend/dist
    depends_on:
      - backend
    networks:
      - app_network

  # nacos服务
  nacos:
    container_name: nacos
    image: nacos/nacos-server:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      MODE: "standalone"
      NACOS_AUTH_TOKEN: "VHc5RHVaNXBxUkZncW0xYWVLSWJIdjM2R3NkV2M4WnM="
      NACOS_AUTH_IDENTITY_KEY: "nacos_auth_identity_key"
      NACOS_AUTH_IDENTITY_VALUE: "nacos_auth_identity_value"
    ports:
      - "8848:8848"
      - "8080:8080"
      - "9848:9848"
    networks:
      - app_network

# 网络
networks:
  app_network:
    driver: bridge
