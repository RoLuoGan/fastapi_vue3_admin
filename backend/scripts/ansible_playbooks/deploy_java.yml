---
# deploy_java.yml - Java service deployment playbook
- name: Deploy Java Service
  hosts: "{{ target_hosts }}"
  gather_facts: false
  tasks:
    - name: Create remote directory
      file:
        path: "{{ remote_pkg_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Copy package file
      copy:
        src: "{{ local_pkg_path }}"
        dest: "{{ remote_pkg_path }}"
        mode: '0644'

    - name: Backup existing service
      shell: "cp -r {{ remote_pkg_path }} {{ remote_pkg_path }}.bak.{{ back_date }}"
      ignore_errors: true

    - name: Execute restart command
      shell: "{{ restart_command }}"
      become: true

