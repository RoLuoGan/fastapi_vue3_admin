---
- name: Deploy Service
  hosts: "{{ target_hosts }}"
  gather_facts: false
  tasks:

    - name: mkdir /data/service/bak/{{ back_date }}
      file:
        path: "/data/service/bak/{{ back_date }}"
        state: directory
      become: true

    - name: mv lib --> {{ service_name }}_{{ back_date }}_lib
      shell: mv /data/service/{{ service_name }}/lib /data/service/bak/{{ back_date }}/{{ service_name }}_{{ back_suffix }}_lib
      become: true

    - name: Download package from OSS
      get_url:
        url: "{{ package_url }}"
        dest: "/tmp/{{ service_name }}_package.tar.gz"
        mode: '0644'
        timeout: 300
      become: true

    - name: Unarchive package to remote
      unarchive:
        src: "/tmp/{{ service_name }}_package.tar.gz"
        dest: "/data/service/{{ service_name }}"
        remote_src: yes
      become: true
    
    - name: Clean up downloaded package
      file:
        path: "/tmp/{{ service_name }}_package.tar.gz"
        state: absent
      become: true
      
    - name: Execute restart command
      shell: "supervisorctl restart {{ service_name }}"
      become: true

