[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-admin"
version = "2.0.0"
description = "一个基于 FastAPI 的现代化后端管理系统，为前端 Vue3 管理系统提供完整的 API 服务支持"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FastAPI Vue3 Admin Team"}
]
keywords = ["fastapi", "vue3", "admin", "backend", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 项目依赖
dependencies = [
    "alembic==1.15.1",
    "APScheduler==3.11.0",
    "fastapi==0.115.2",
    "Jinja2==3.1.6",
    "typer==0.9.0",
    "click==8.1.7",
    "uvicorn==0.30.6",
    "gunicorn==23.0.0",
    "websockets==14.2",
    "httpx==0.28.1",
    "croniter==6.0.0",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "SQLAlchemy==2.0.36",
    "pillow==11.0.0",
    "pydantic_validation_decorator==0.1.4",
    "passlib==1.7.4",
    "user-agents==2.2.0",
    "PyJWT==2.9.0",
    "pydantic-settings==2.5.2",
    "psutil==6.1.0",
    "python-multipart==0.0.9",
    "greenlet==3.1.1",
    "bcrypt==4.3.0",
    "itsdangerous==2.2.0",
    "aiofiles==24.1.0",
    "redis==5.2.1",
    "aiosqlite==0.17.0",
    "asyncmy==0.2.9",
    "motor==3.6.0",
    "asyncpg==0.30.0",
    "psycopg2==2.9.10",
    "PyMySQL==1.1.2",
    "cryptography==45.0.2",
    "openai==1.55.2",
    "oss2==2.18.4",
    "rich==13.9.4",
    "sqlglot[rs]==27.8.0",
    "ansible==8.7.0",
]

# 可选依赖组
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.28.0",
]

# 项目入口点 - 打包后可通过命令行工具运行
[project.scripts]
devops-admin = "main:shell_app"

[tool.setuptools]
# 包发现配置 - 自动发现所有包
packages = {find = {}}

# 额外包含单文件模块（例如 main.py）
py-modules = ["main"]

# 包含非 Python 文件到分发包中
[tool.setuptools.package-data]
"*" = ["*.ini", "*.json", "*.j2", "*.sql", "*.md"]
"app.alembic" = ["versions/*.py"]
"app.scripts" = ["data/*.json"]

# 包含数据文件
[tool.setuptools.data-files]
# alembic.ini 会在安装时复制到合适的位置
# 注意：alembic.ini 需要手动处理，或通过 MANIFEST.in 包含

# Black 代码格式化配置
[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Ruff 代码检查配置
[tool.ruff]
line-length = 120
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy 类型检查配置
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "ansible.*",
    "motor.*",
    "oss2.*",
]
ignore_missing_imports = true

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

